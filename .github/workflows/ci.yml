name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The workflow only reads the repository. Nothing here publishes, deploys, or
# touches secrets, so it gets no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails when package-lock.json and package.json disagree,
      # so a dependency cannot drift in without the lockfile being updated.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
