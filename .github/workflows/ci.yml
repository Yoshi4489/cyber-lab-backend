name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The workflow only reads the repository. Nothing here publishes, deploys, or
# touches secrets, so it gets no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://cyber_range:phase1-ci-only@127.0.0.1:5432/cyber_range
      TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyber_range
          POSTGRES_PASSWORD: phase1-ci-only
          POSTGRES_DB: cyber_range
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyber_range -d cyber_range"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails when package-lock.json and package.json disagree,
      # so a dependency cannot drift in without the lockfile being updated.
      - name: Install dependencies
        run: npm ci

      - name: Validate local service configuration
        run: DEV_POSTGRES_PASSWORD="$(openssl rand -hex 32)" docker compose --env-file .env.example config --quiet

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
